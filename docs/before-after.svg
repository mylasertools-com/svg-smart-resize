<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="614" viewBox="0 0 1280 614" role="img"><title>SVG Smart Resize — change the size, keep the fit</title><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}</style><rect width="1280" height="614" rx="20" fill="#f3f5ef"/><text x="40" y="52" font-size="15" fill="#47705d" font-weight="600">SCALE THE DESIGN. PRESERVE THE DIMENSIONS THAT MATTER.</text><text x="40" y="99" font-size="32" fill="#172f2d" font-weight="600">One design. Three very different fits.</text><rect x="40" y="134" width="382" height="377" rx="14" fill="#ffffff" stroke="#d9e2d6"/><text x="64" y="173" font-size="20" fill="#172f2d" font-weight="600">Original</text><text x="64" y="198" font-size="13" fill="#738171" font-weight="400">120 × 64 mm</text><svg x="118.5" y="267" xmlns="http://www.w3.org/2000/svg" width="225" height="120" viewBox="0 0 120 64"><path id="panel" d="M0 0H28V24H32V0H58V24H62V0H88V24H92V0H120V64H0Z" fill="#cdd5f0" stroke="#7583b0" stroke-width=".45"/><circle id="mount-left" cx="12" cy="52" r="3" fill="#f4f5f2" stroke="#7583b0" stroke-width=".4"/><circle id="mount-right" cx="108" cy="52" r="3" fill="#f4f5f2" stroke="#7583b0" stroke-width=".4"/></svg><line x1="64" y1="444" x2="398" y2="444" stroke="#dce5d8"/><text x="64" y="474" font-size="14" fill="#67796c" font-weight="600">HOLES  Ø 6 mm</text><text x="219" y="474" font-size="14" fill="#67796c" font-weight="600">SLOTS  4 × 24 mm</text><text text-anchor="middle" x="231" y="541" font-size="14" fill="#67796c" font-weight="500">The starting geometry</text><rect x="449" y="134" width="382" height="377" rx="14" fill="#ffffff" stroke="#d9e2d6"/><text x="473" y="173" font-size="20" fill="#172f2d" font-weight="600">Ordinary resize</text><text x="473" y="198" font-size="13" fill="#738171" font-weight="400">180 × 96 mm</text><svg x="471.25" y="237" xmlns="http://www.w3.org/2000/svg" width="337.5" height="180" viewBox="0 0 180 96" preserveAspectRatio="none" transform="">
